<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>にほんご活字堂 助詞 | Particle Focus — N5・N4・N3</title>
<meta name="description" content="Joshi (particle) -focused Japanese practice for Filipino learners — listen, choose, assemble, speak. N5/N4/N3, 360 questions.">
<meta name="theme-color" content="#EFEAE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== Yoshida EdTech Works — base tokens (common) ===== */
  :root{
    --ink:        #2B2926;
    --cream:      #EFEAE0;
    --cream-deep: #E4DECE;
    --stone:      #C9C2B4;
    --stone-line: #DDD6C6;

    /* ===== theme-learning (mango) — the ONE accent this app uses ===== */
    --accent-fill: #E08A34;
    --accent-text: #A85F1D;
    --accent-soft: #EFC79A;

    /* feedback (functional, not brand accent) */
    --ok:      #5C7A52;
    --ok-soft: #E7EFE1;
    --ng:      #A64B42;
    --ng-soft: #F3E3E0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', -apple-system, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .jp{ font-family:'Zen Kaku Gothic New', sans-serif; }
  .jp-display{ font-family:'Shippori Mincho', serif; }
  .romaji{ font-family:'Zen Kaku Gothic New', sans-serif; }

  #app{ max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:24px; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:16px 20px 14px;
    border-bottom:1px solid var(--stone-line);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; min-width:0; }
  .brand .mark{
    color:var(--accent-text); font-size:14px; letter-spacing:.02em; flex-shrink:0;
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--accent-fill);
    display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif;
  }
  .brand .name{ font-family:'Shippori Mincho', serif; font-size:15px; letter-spacing:.02em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand .sub{ font-size:9px; color:var(--ink); opacity:.6; letter-spacing:.1em; white-space:nowrap; }
  .header-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }

  .lang-toggle{ display:flex; border:1.5px solid var(--stone-line); border-radius:20px; overflow:hidden; flex-shrink:0; }
  .lang-toggle button{
    background:none; border:none; color:var(--ink); opacity:.6;
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:11px; letter-spacing:.05em; font-weight:700;
    padding:6px 12px; cursor:pointer; min-height:40px;
  }
  .lang-toggle button.active{ background:var(--accent-fill); color:var(--cream); opacity:1; }

  .icon-btn{
    background:none;border:1.5px solid var(--stone-line); color:var(--accent-text);
    font-size:14px; width:36px; height:36px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn:hover{ border-color:var(--accent-fill); }
  .back-btn{
    background:none;border:1.5px solid var(--stone-line); color:var(--accent-text);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:12px; letter-spacing:.05em;
    padding:7px 12px; border-radius:8px; cursor:pointer; flex-shrink:0; min-height:36px;
  }
  .back-btn:hover{ border-color:var(--accent-fill); }

  .screen{ flex:1; display:none; flex-direction:column; padding:22px 20px 8px; animation:fadeIn .22s ease; }
  .screen.active{ display:flex; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Level selector (tab pattern: selected = accent-fill border + accent-text) ---------- */
  .level-selector{ display:flex; gap:8px; margin-bottom:20px; }
  .level-pill{
    flex:1; background:var(--cream); border:1.5px solid var(--stone-line); border-radius:10px;
    padding:12px 10px; text-align:center; cursor:pointer; position:relative; min-height:40px;
  }
  .level-pill:hover{ border-color:var(--accent-fill); }
  .level-pill.active{ border-color:var(--accent-fill); background:var(--cream-deep); }
  .level-pill .lp-code{ font-family:'Shippori Mincho',serif; font-size:17px; color:var(--ink); opacity:.55; }
  .level-pill.active .lp-code{ color:var(--accent-text); opacity:1; }
  .level-pill .lp-name{ font-size:10px; color:var(--ink); opacity:.6; margin-top:2px; letter-spacing:.02em; }
  .level-pill.disabled{ opacity:.45; cursor:not-allowed; }
  .level-pill .lp-soon{
    position:absolute; top:-7px; right:-6px; background:var(--stone); color:var(--ink);
    font-size:8px; letter-spacing:.06em; padding:2px 5px; border-radius:8px; font-weight:700;
  }

  .hero{ margin-bottom:22px; }
  .hero .eyebrow{ color:var(--accent-text); font-size:11px; letter-spacing:.16em; margin-bottom:6px; font-weight:700; }
  .hero h1{ font-family:'Shippori Mincho', serif; font-size:23px; margin:0 0 8px; line-height:1.45; color:var(--ink); font-weight:700; }
  .hero p{ color:var(--ink); opacity:.72; font-size:13px; line-height:1.8; margin:0; }

  .weak-cta{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--cream-deep);
    border:1.5px solid var(--accent-fill); border-radius:12px; padding:14px 16px; margin-bottom:22px; cursor:pointer;
    min-height:40px;
  }
  .weak-cta:hover{ border-color:var(--accent-text); }
  .weak-cta .wl-title{ font-size:14px; color:var(--accent-text); font-weight:700; }
  .weak-cta .wl-sub{ font-size:11px; color:var(--ink); opacity:.65; margin-top:3px; }
  .weak-cta .wl-count{ font-family:'Shippori Mincho',serif; font-size:26px; color:var(--accent-text); }

  .unit-list{ display:flex; flex-direction:column; gap:10px; }
  .unit-row{
    display:flex; align-items:center; gap:14px;
    background:var(--cream); border:1px solid var(--stone-line);
    border-radius:12px; padding:13px 14px; cursor:pointer;
    transition:border-color .15s, transform .15s;
    min-height:40px;
  }
  .unit-row:hover{ border-color:var(--accent-fill); transform:translateX(2px); }
  .unit-seal{
    width:42px; height:42px; border-radius:50%; border:1.5px solid var(--accent-fill);
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-size:15px; color:var(--accent-text); flex-shrink:0;
  }
  .unit-seal.mastered{ border-color:var(--accent-fill); background:var(--cream-deep); color:var(--accent-text); font-weight:700; }
  .unit-body{ flex:1; min-width:0; }
  .unit-theme{ font-size:14px; font-weight:700; color:var(--ink); }
  .unit-particle{
    display:inline-block; font-family:'Zen Kaku Gothic New',sans-serif; font-size:10.5px; color:var(--accent-text);
    background:var(--cream-deep); border-radius:999px; padding:2px 8px; margin-top:4px;
  }
  .unit-desc{ font-size:11px; color:var(--ink); opacity:.65; margin-top:4px; line-height:1.5; }
  .unit-track{ height:4px; background:var(--stone); border-radius:2px; margin-top:8px; overflow:hidden; }
  .unit-fill{ height:100%; background:var(--accent-fill); border-radius:2px; transition:width .3s; }
  .unit-count{ font-family:'Shippori Mincho',serif; font-size:12px; color:var(--ink); opacity:.6; white-space:nowrap; }

  .lesson-progress{ display:flex; gap:5px; margin-bottom:22px; flex-wrap:wrap; }
  .dot{ width:100%; max-width:22px; flex:1; height:5px; border-radius:3px; background:var(--stone); }
  .dot.done{ background:var(--accent-soft); }
  .dot.now{ background:var(--accent-fill); }
  .dot.wrong{ background:var(--ng); }

  .step-label{ color:var(--accent-text); font-size:11px; letter-spacing:.16em; margin-bottom:10px; font-weight:700; }
  .q-unit-tag{ color:var(--ink); opacity:.6; font-size:11px; margin-bottom:2px; }

  .listen-stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:30px 0 10px; }
  .speaker-btn{
    width:104px; height:104px; border-radius:50%; border:1.5px solid var(--accent-fill);
    background:var(--cream-deep);
    color:var(--accent-text); font-size:34px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
  }
  .speaker-btn.playing{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(224,138,52,.35);} 70%{box-shadow:0 0 0 18px rgba(224,138,52,0);} 100%{box-shadow:0 0 0 0 rgba(224,138,52,0);} }
  .listen-hint{ color:var(--ink); opacity:.65; font-size:12px; text-align:center; letter-spacing:.02em; line-height:1.7; }
  .listen-count{ font-size:11px; color:var(--accent-text); }

  .primary-btn{
    background:var(--accent-fill); color:var(--cream); border:none; font-weight:700;
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px; letter-spacing:.02em;
    padding:14px 22px; border-radius:12px; cursor:pointer; width:100%; min-height:40px;
  }
  .primary-btn:disabled{ background:var(--stone); color:var(--ink); opacity:.55; cursor:not-allowed; }
  .primary-btn:not(:disabled):hover{ background:var(--accent-text); }
  .ghost-btn{
    background:var(--cream); border:1.5px solid var(--accent-fill); color:var(--accent-text);
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700; padding:12px 18px;
    border-radius:12px; cursor:pointer; width:100%; min-height:40px;
  }
  .ghost-btn:hover{ background:var(--cream-deep); }

  .blank-sentence{
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:21px; line-height:2;
    text-align:center; padding:26px 10px; margin-bottom:22px;
    background:var(--cream-deep); border:1px solid var(--stone-line); border-radius:12px;
    letter-spacing:.02em; color:var(--ink);
  }
  .blank-sentence .slot{
    display:inline-block; min-width:56px; border-bottom:2px solid var(--accent-fill);
    color:var(--accent-fill); margin:0 4px;
  }
  .blank-sentence .slot.filled{ color:var(--accent-text); font-weight:700; }

  .choice-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .choice{
    background:var(--cream); border:1.5px solid var(--stone-line); border-radius:12px;
    padding:14px 16px; font-size:16px; cursor:pointer; text-align:center;
    font-family:'Zen Kaku Gothic New',sans-serif; color:var(--ink); min-height:40px;
  }
  .choice:hover{ border-color:var(--accent-fill); }
  .choice.correct{ border-color:var(--ok); background:var(--ok-soft); color:var(--ok); }
  .choice.wrong{ border-color:var(--ng); background:var(--ng-soft); color:var(--ng); }
  .choice.disabled{ pointer-events:none; opacity:.55; }

  .assembly-line{
    min-height:66px; border:1.5px dashed var(--stone-line); border-radius:12px;
    display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px;
    margin-bottom:18px; background:var(--cream-deep);
  }
  .assembly-line.filled{ border-style:solid; border-color:var(--accent-fill); }
  .assembly-placeholder{ color:var(--ink); opacity:.5; font-size:12px; letter-spacing:.05em; }
  .type-block{
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:16px;
    background:var(--cream);
    border:1.5px solid var(--stone-line); color:var(--ink);
    padding:9px 14px; border-radius:8px; cursor:pointer; user-select:none;
  }
  .type-block:hover{ border-color:var(--accent-fill); }
  .type-block.placed{ opacity:.3; cursor:default; }
  .type-block.used-slot{
    background:var(--cream); border-color:var(--accent-fill); color:var(--accent-text); font-weight:700;
  }
  .type-pool{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .assembly-caption{ font-size:11px; color:var(--ink); opacity:.6; margin:-10px 0 16px; letter-spacing:.02em; }

  .reveal-card{
    background:var(--cream-deep); border:1px solid var(--stone-line); border-radius:12px;
    padding:22px 20px; margin-bottom:16px;
  }
  .reveal-jp{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:22px; line-height:1.7; color:var(--ink); margin-bottom:6px; font-weight:700; }
  .reveal-romaji{ font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; color:var(--accent-text); margin-bottom:12px; opacity:.85; }
  .reveal-meaning{ font-size:13px; color:var(--ink); opacity:.7; margin-bottom:14px; }
  .reveal-tip{ border-top:1px solid var(--stone-line); padding-top:12px; font-size:12.5px; line-height:1.8; color:var(--ink); }
  .reveal-tip b{ color:var(--accent-text); }
  .reveal-tip .tip-lang-note{ font-size:10px; color:var(--ink); opacity:.5; display:block; margin-top:6px; }
  .replay-row{ display:flex; gap:10px; margin-bottom:8px; }
  .replay-row .speaker-mini{
    width:44px; height:44px; border-radius:50%; border:1.5px solid var(--accent-fill);
    background:var(--cream); color:var(--accent-text); font-size:16px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .complete-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; }
  .complete-seal{
    width:90px; height:90px; border-radius:50%; border:2px solid var(--accent-fill);
    display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif;
    font-size:15px; color:var(--accent-text); margin-bottom:18px; background:var(--cream-deep);
  }
  .complete-title{ font-family:'Shippori Mincho',serif; font-size:19px; margin-bottom:6px; color:var(--ink); font-weight:700; }
  .complete-score{ font-family:'Shippori Mincho',serif; font-size:36px; color:var(--accent-text); margin:10px 0 4px; font-weight:700; }
  .complete-meta{ font-size:12px; color:var(--ink); opacity:.65; margin-bottom:26px; }
  .complete-actions{ display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px; }

  footer.credit{ text-align:center; font-size:10px; color:var(--ink); opacity:.55; padding:18px 0 4px; letter-spacing:.05em; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(43,41,38,.55); z-index:50; display:none; align-items:flex-end; justify-content:center; }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:640px; background:var(--cream); border-top:1.5px solid var(--accent-fill);
    border-radius:16px 16px 0 0; padding:22px 22px 28px; animation:slideUp .22s ease;
  }
  @keyframes slideUp{ from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .modal-title{ font-family:'Shippori Mincho',serif; font-size:17px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; color:var(--ink); font-weight:700; }
  .modal-title .close-x{ cursor:pointer; color:var(--ink); opacity:.6; font-size:18px; }
  .setting-row{ margin-bottom:20px; }
  .setting-label{ font-size:12px; color:var(--ink); opacity:.65; margin-bottom:8px; display:flex; justify-content:space-between; }
  .setting-label span.val{ color:var(--accent-text); opacity:1; font-family:'Shippori Mincho',serif; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:2px; background:var(--stone); outline:none; }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent-fill); cursor:pointer; border:2px solid var(--cream);
  }
  select.voice-select{
    width:100%; background:var(--cream-deep); color:var(--ink); border:1px solid var(--stone-line);
    border-radius:8px; padding:10px 12px; font-size:13px; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .speed-presets{ display:flex; gap:8px; margin-top:10px; }
  .speed-presets button{
    flex:1; background:var(--cream-deep); border:1.5px solid var(--stone-line); color:var(--ink); opacity:.7;
    border-radius:8px; padding:8px 4px; font-size:11px; cursor:pointer; min-height:40px;
  }
  .speed-presets button.active{ border-color:var(--accent-fill); color:var(--accent-text); opacity:1; font-weight:700; }
  .voice-warn{ font-size:11px; color:var(--ink); opacity:.6; margin-top:8px; line-height:1.6; }
  :focus-visible{ outline:3px solid var(--accent-fill); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .screen, .unit-row, .unit-fill{ animation:none !important; transition:none !important; } }
</style>

</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark">活</span>
      <div style="min-width:0;">
        <div class="name" id="brandName">にほんご活字堂 助詞</div>
        <div class="sub" id="brandSub">PARTICLE FOCUS · 120Q</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-toggle">
        <button id="langTlBtn" class="active">TL</button>
        <button id="langEnBtn">EN</button>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Voice settings">⚙</button>
      <button class="back-btn" id="headerBackBtn" style="display:none;"></button>
    </div>
  </header>

  <!-- HOME -->
  <section class="screen active" id="screen-home">

    <div class="level-selector" id="levelSelector"></div>

    <div class="hero">
      <div class="eyebrow" id="heroEyebrow">5-STEP NA PARAAN</div>
      <h1 id="heroTitle">Simulan ang Nihongo<br>mula sa mismong ugat.</h1>
      <p id="heroDesc"></p>
    </div>

    <div class="weak-cta" id="weakCta" style="display:none;">
      <div>
        <div class="wl-title" id="weakTitle">Weak Point Review</div>
        <div class="wl-sub" id="weakSub">Balikan lang ang mga tanong na na-miss mo</div>
      </div>
      <div class="wl-count" id="weakCount">0</div>
    </div>

    <div class="unit-list" id="unitList"></div>

    <footer class="credit">EdTech Nihongo family · Yoshida EdTech Works</footer>
  </section>

  <!-- LESSON -->
  <section class="screen" id="screen-lesson">
    <div class="q-unit-tag" id="lessonUnitTag"></div>
    <div class="lesson-progress" id="progressDots"></div>

    <!-- STEP 1 -->
    <div id="step1" class="step-pane">
      <div class="step-label" id="step1Label">STEP 1</div>
      <div class="listen-stage">
        <button class="speaker-btn" id="playBtn">▶</button>
        <div class="listen-hint" id="listenHint"></div>
        <div class="listen-count" id="listenCount"></div>
      </div>
      <button class="primary-btn" id="toStep2Btn" disabled></button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step-pane" style="display:none;">
      <div class="step-label" id="step2Label">STEP 2</div>
      <div class="blank-sentence" id="blankSentence"></div>
      <div class="choice-list" id="choiceList"></div>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="step-pane" style="display:none;">
      <div class="step-label" id="step3Label">STEP 3</div>
      <div class="assembly-line" id="assemblyLine"></div>
      <div class="assembly-caption" id="assemblyCaption"></div>
      <div class="type-pool" id="typePool"></div>
      <button class="ghost-btn" id="resetChunksBtn"></button>
    </div>

    <!-- STEP 4 -->
    <div id="step4" class="step-pane" style="display:none;">
      <div class="step-label" id="step4Label">STEP 4</div>
      <div class="reveal-card">
        <div class="replay-row">
          <button class="speaker-mini" id="replayBtn">▶</button>
        </div>
        <div class="reveal-jp jp" id="revealJp"></div>
        <div class="reveal-romaji romaji" id="revealRomaji"></div>
        <div class="reveal-meaning" id="revealMeaning"></div>
        <div class="reveal-tip" id="revealTip"></div>
      </div>
      <button class="primary-btn" id="nextQBtn"></button>
    </div>
  </section>

  <!-- UNIT COMPLETE -->
  <section class="screen" id="screen-complete">
    <div class="complete-wrap">
      <div class="complete-seal" id="completeSealText">済</div>
      <div class="complete-title" id="completeUnitName"></div>
      <div class="complete-score" id="completeScore"></div>
      <div class="complete-meta" id="completeMeta"></div>
      <div class="complete-actions">
        <button class="primary-btn" id="retryWrongBtn" style="display:none;"></button>
        <button class="ghost-btn" id="toHomeBtn"></button>
      </div>
    </div>
  </section>

</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal-sheet">
    <div class="modal-title"><span id="settingsTitle">Voice Settings</span><span class="close-x" id="closeSettings">✕</span></div>
    <div class="setting-row">
      <div class="setting-label"><span id="speedLabel">Bilis ng Boses</span><span class="val" id="speedVal">0.90x</span></div>
      <input type="range" id="speedRange" min="0.5" max="1.3" step="0.05" value="0.90">
      <div class="speed-presets">
        <button data-speed="0.65" id="spdSlow"></button>
        <button data-speed="0.90" id="spdNormal" class="active"></button>
        <button data-speed="1.1" id="spdFast"></button>
      </div>
    </div>

    {"id":"u07_q03","unit":7,"target_ja":"フィリピンへ いくなら、ひこうきが いいです。","romaji":"Firipin e iku nara, hikouki ga ii desu.","tl_meaning":"Kung pupunta sa Pilipinas, mas maganda ang eroplano.","en_meaning":"If you are going to the Philippines, an airplane is better.","blank_q":"フィリピンへ いく ␣ ひこうきが いいです。","options":["なら (nara)","ば (ba)","たら (tara)"],"chunks":["フィリピンへ","いくなら、ひこうきが","いいです。"],"tip_tl":"Verb dictionary form + なら = kung tungkol sa / kung... (topic condition).","correct":0},
    {"id":"u07_q04","unit":7,"target_ja":"安（やす）いなら、かいます。","romaji":"Yasui nara, kaimasu.","tl_meaning":"Kung mura pala, bibilhin ko.","en_meaning":"If it's cheap, I will buy it.","blank_q":"やすい ␣ かいます。","options":["なら (nara)","ば (ba)","たら (tara)"],"chunks":["安（やす）いなら、かいます。"],"tip_tl":"i-adjective + なら = kung mura.","correct":0},
    {"id":"u07_q05","unit":7,"target_ja":"べんきょうすれば、わかります。","romaji":"Benkyou sureba, wakarimasu.","tl_meaning":"Kung mag-aaral ka, maiintindihan mo.","en_meaning":"If you study, you will understand.","blank_q":"べんきょう ␣ わかります。","options":["すれば (sureba)","するば (suruba)","すれ (sure)"],"chunks":["べんきょうすれば、わかります。"],"tip_tl":"Suru verb conditional: 'すれば (sureba)'.","correct":0},
    {"id":"u07_q06","unit":7,"target_ja":"雨（あめ）が ふらなければ、でかけます。","romaji":"Ame ga furanakereba, dekakemasu.","tl_meaning":"Kapag hindi umulan, lalabas ako.","en_meaning":"If it does not rain, I will go out.","blank_q":"あめが ␣ でかけます。","options":["ふらなければ (furanakereba)","ふらないば (furanaiba)","ふらないなら (furanainara)"],"chunks":["雨（あめ）が","ふらなければ、でかけます。"],"tip_tl":"Negative conditional: 'ふらなければ (if it doesn't rain)'.","correct":0},
    {"id":"u07_q07","unit":7,"target_ja":"たろーさんが いくなら、わたしも いきます。","romaji":"Taro-san ga iku nara, watashi mo ikimasu.","tl_meaning":"Kung pupunta si Taro, pupunta rin ako.","en_meaning":"If Taro goes, I will go too.","blank_q":"たろーさんが いく ␣ わたしもいきます。","options":["なら (nara)","ば (ba)","たら (tara)"],"chunks":["たろーさんが","いくなら、わたしも","いきます。"],"tip_tl":"'なら' ay ginagamit kapag ang kondisyon ay base sa sinabi o balak ng ibang tao (hearsay/topic-based condition): 'kung sasabihin niyang pupunta siya, ~'.","correct":0},
    {"id":"u07_q08","unit":7,"target_ja":"ひまなら、あそびましょう。","romaji":"Hima nara, asobimashou.","tl_meaning":"Kung libre ka, maglaro/magsaya tayo.","en_meaning":"If you are free, let's hang out.","blank_q":"ひま ␣ あそびましょう。","options":["なら (nara)","ば (ba)","たら (tara)"],"chunks":["ひまなら、あそびましょう。"],"tip_tl":"Na-adjective + なら = kung libre.","correct":0},
    {"id":"u07_q09","unit":7,"target_ja":"はやく おきれば、まにあいます。","romaji":"Hayaku okireba, maniamasu.","tl_meaning":"Kung gigising ka nang maaga, maiintindihan/makakaabot ka sa oras.","en_meaning":"If you wake up early, you will be on time.","blank_q":"はやく ␣ まにあいます。","options":["おきれば (okireba)","おきるば (okiruba)","おきなら (okinara)"],"chunks":["はやく","おきれば、まにあいます。"],"tip_tl":"Gumising nang maaga conditional: 'おきれば'.","correct":0},
    {"id":"u07_q10","unit":7,"target_ja":"むずかしくなければ、できます。","romaji":"Muzukashikunakereba, dekimasu.","tl_meaning":"Kung hindi mahirap, kaya ko.","en_meaning":"If it is not difficult, I can do it.","blank_q":"むずかしく ␣ できます。","options":["なければ (nakereba)","ないば (naiba)","ないなら (nainara)"],"chunks":["むずかしくなければ、できます。"],"tip_tl":"Kung hindi mahirap: 'むずかしくなければ'.","correct":0},
    {"id":"u07_q11","unit":7,"target_ja":"ボタンを おせば、ドアが あきます。","romaji":"Botan wo oseba, doa ga akimasu.","tl_meaning":"Kung pipindutin ang button, bubukas ang pinto.","en_meaning":"If you press the button, the door opens.","blank_q":"ボタンを ␣ ドアがあきます。","options":["おせば (oseba)","おすば (osuba)","おしなら (oshinara)"],"chunks":["ボタンを","おせば、ドアが","あきます。"],"tip_tl":"'ば (ba)' na conditional form ng 'おす' ay 'おせば' — pandiwang-ugat + えば para sa mga u-verb.","correct":0},
    {"id":"u07_q12","unit":7,"target_ja":"にほんごなら、たろーさんに きいてください。","romaji":"Nihongo nara, Taro-san ni kiite kudasai.","tl_meaning":"Kung tungkol sa wikang Hapones, magtanong ka kay Taro.","en_meaning":"If it's about Japanese, please ask Taro.","blank_q":"にほんご ␣ たろーさんにきいてください。","options":["なら (nara)","ば (ba)","たら (tara)"],"chunks":["にほんごなら、たろーさんに","きいてください。"],"tip_tl":"Kung wikang Hapones: 'にほんごなら'.","correct":0},
    {"id":"u08_q01","unit":8,"target_ja":"しゃちょうは いらっしゃいますか？","romaji":"Shachou wa irasshaimasu ka?","tl_meaning":"Nandito po ba ang presidente / boss?","en_meaning":"Is the company president here?","blank_q":"しゃちょうは ␣ か？","options":["いらっしゃいます (irasshaimasu)","います (imasu)","おります (orimasu)"],"chunks":["しゃちょうは","いらっしゃいますか？"],"tip_tl":"尊敬語 (Sonkeigo) ng 'います / いきます / きます' ay 'いらっしゃいます'.","correct":0},
    {"id":"u08_q02","unit":8,"target_ja":"せんせいは もう おかえりになりました。","romaji":"Sensei wa mou okaeri ni narimashita.","tl_meaning":"Nakaalis / Nakauwi na po ang guro.","en_meaning":"The teacher has already returned home.","blank_q":"おかえり ␣ なりました。","options":["に (ni)","を (o)","で (de)"],"chunks":["せんせいは","もう","おかえりになりました。"],"tip_tl":"お + Verb stem + になります = pormal na paggalang (Sonkeigo pattern).","correct":0},
    {"id":"u08_q03","unit":8,"target_ja":"なにを めしあがりますか？","romaji":"Nani wo meshiagarmasu ka?","tl_meaning":"Ano po ang kakainin / iinumin ninyo?","en_meaning":"What will you eat / drink?","blank_q":"なにを ␣ か？","options":["めしあがります (meshiagarmasu)","たべます (tabemasu)","いただきます (itadakimasu)"],"chunks":["なにを","めしあがりますか？"],"tip_tl":"尊敬語 ng 'たべます / のみます' ay 'めしあがります'.","correct":0},
    {"id":"u08_q04","unit":8,"target_ja":"しゃちょうが おっしゃいました。","romaji":"Shachou ga osshaimashita.","tl_meaning":"Sinabi po ng presidente.","en_meaning":"The president said.","blank_q":"しゃちょうが ␣","options":["おっしゃいました (osshaimashita)","いいました (iimashita)","申しました (moushimashita)"],"chunks":["しゃちょうが","おっしゃいました。"],"tip_tl":"尊敬語 ng 'いいました' ay 'おっしゃいました'.","correct":0},
    {"id":"u08_q05","unit":8,"target_ja":"この 本（ほん）を およみになりましたか？","romaji":"Kono hon wo oyomi ni narimashita ka?","tl_meaning":"Nabasa niyo na po ba ang librong ito?","en_meaning":"Have you read this book?","blank_q":"およみに ␣ か？","options":["なりました (narimashita)","しました (shimashita)","ありました (arimashita)"],"chunks":["この","本（ほん）を","およみになりましたか？"],"tip_tl":"Nabasa niyo na po: 'およみに なりましたか'.","correct":0},
    {"id":"u08_q06","unit":8,"target_ja":"どちらに ございますか？","romaji":"Dochira ni gozaimasu ka?","tl_meaning":"Nasaan po ba?","en_meaning":"Where is it?","blank_q":"どちらに ␣ か？","options":["ございます (gozaimasu)","あります (arimasu)","いらっしゃいます (irasshaimasu)"],"chunks":["どちらに","ございますか？"],"tip_tl":"Teineigo/Sonkeigo ng 'あります' ay 'ございます'.","correct":0},
    {"id":"u08_q07","unit":8,"target_ja":"先生（せんせい）は ごぞんじですか？","romaji":"Sensei wa gozonji desu ka?","tl_meaning":"Alam po ba ng guro?","en_meaning":"Does the teacher know?","blank_q":"ごぞんじ ␣ か？","options":["ですか (desu ka)","しますか (shimasu ka)","ますか (masu ka)"],"chunks":["先生（せんせい）は","ごぞんじですか？"],"tip_tl":"尊敬語 ng '知っていますか' ay 'ごぞんじですか'.","correct":0},
    {"id":"u08_q08","unit":8,"target_ja":"しゃちょうは きょう おやすみです。","romaji":"Shachou wa kyou oyasumi desu.","tl_meaning":"Naka-leave / Nagpapahinga po ang presidente ngayon.","en_meaning":"The president is off today.","blank_q":"きょう ␣ です。","options":["おやすみ (oyasumi)","やすみ (yasumi)","やすんで (yasunde)"],"chunks":["しゃちょうは","きょう","おやすみです。"],"tip_tl":"Paggalang sa pahinga ng nakatataas: 'おやすみです'.","correct":0},
    {"id":"u08_q09","unit":8,"target_ja":"少々（しょうしょう） おまちください。","romaji":"Shoushou omachi kudasai.","tl_meaning":"Paki-hintay po nang sandali.","en_meaning":"Please wait a moment.","blank_q":"おまち ␣","options":["ください (kudasai)","になります (ni narimasu)","します (shimasu)"],"chunks":["少々（しょうしょう）","おまちください。"],"tip_tl":"お + Verb stem + ください = magalang na pakiusap (Sonkeigo).","correct":0},
    {"id":"u08_q10","unit":8,"target_ja":"どうぞ ごらんください。","romaji":"Douzo goran kudasai.","tl_meaning":"Paki-tingin po.","en_meaning":"Please have a look.","blank_q":"ごらん ␣","options":["ください (kudasai)","になります (ni narimasu)","します (shimasu)"],"chunks":["どうぞ","ごらんください。"],"tip_tl":"尊敬語 ng 'みてください' ay 'ごらんください'.","correct":0},
    {"id":"u08_q11","unit":8,"target_ja":"どちらから いらっしゃいましたか？","romaji":"Dochira kara irasshaimashita ka?","tl_meaning":"Saan po kayo galing?","en_meaning":"Where did you come from?","blank_q":"どちらから ␣ か？","options":["いらっしゃいました (irasshaimashita)","きました (kimashita)","まいりました (mairimashita)"],"chunks":["どちらから","いらっしゃいましたか？"],"tip_tl":"Saan po galing: 'いらっしゃいましたか'.","correct":0},
    {"id":"u08_q12","unit":8,"target_ja":"おなまえを おききしてもいいですか？","romaji":"Onamae wo okiki shite mo ii desu ka?","tl_meaning":"Maaari ko po bang itanong ang pangalan ninyo?","en_meaning":"May I ask your name?","blank_q":"おきき ␣ いいですか？","options":["しても (shite mo)","になって (ni natte)","くれて (kurete)"],"chunks":["おなまえを","おききしてもいいですか？"],"tip_tl":"Maaari ko pong itanong: 'おききしても いいですか'.","correct":0},
    {"id":"u09_q01","unit":9,"target_ja":"わたしは たろーと もうします。","romaji":"Watashi wa Taro to moushimasu.","tl_meaning":"Ang pangalan ko po ay Taro (humble).","en_meaning":"My name is Taro.","blank_q":"たろーと ␣","options":["もうします (moushimasu)","おっしゃいます (osshaimasu)","いいま (iima)"],"chunks":["わたしは","たろーと","もうします。"],"tip_tl":"謙譲語 (Kenjougo) ng '言います' kapag ipinapakilala ang sarili ay '申します'.","correct":0},
    {"id":"u09_q02","unit":9,"target_ja":"あした １０じに まいります。","romaji":"Ashita juu-ji ni mairimasu.","tl_meaning":"Pupunta/Darating po ako ng 10 o'clock bukas.","en_meaning":"I will come/go at 10 o'clock tomorrow.","blank_q":"１０じに ␣","options":["まいります (mairimasu)","いらっしゃいます (irasshaimasu)","いきます (ikimasu)"],"chunks":["あした","１０じに","まいります。"],"tip_tl":"謙譲語 ng 'いきます / きます' ay '参ります (mairimasu)'.","correct":0},
    {"id":"u09_q03","unit":9,"target_ja":"荷物（にもつ）を おもちします。","romaji":"Nimotsu wo omochi shimasu.","tl_meaning":"Bubuhatin/Dadalhin ko po ang bagahe ninyo.","en_meaning":"I will carry your luggage.","blank_q":"おもち ␣","options":["します (shimasu)","になります (ni narimasu)","くださ (kudasa)"],"chunks":["荷物（にもつ）を","おもちします。"],"tip_tl":"お + Verb stem + します = ipinapakita ang pagpapakumbaba sa pagtulong.","correct":0},
    {"id":"u09_q04","unit":9,"target_ja":"わたしが おくりいたします。","romaji":"Watashi ga okuri itashimasu.","tl_meaning":"Ihahatid ko po kayo.","en_meaning":"I will escort you.","blank_q":"おくり ␣","options":["いたします (itashimasu)","になります (ni narimasu)","くださ (kudasa)"],"chunks":["わたしが","おくりいたします。"],"tip_tl":"謙譲語 ng 'します' ay 'いたします'.","correct":0},
    {"id":"u09_q05","unit":9,"target_ja":"しゃちょうに おあいしました。","romaji":"Shachou ni oai shimashita.","tl_meaning":"Nakipagkita po ako sa presidente.","en_meaning":"I met the company president.","blank_q":"しゃちょうに ␣","options":["おあいしました (oai shimashita)","あわれました (awaremashita)","あいになりま (ai ni narima)"],"chunks":["しゃちょうに","おあいしました。"],"tip_tl":"Nakipagkita (humble): 'おあいしました'.","correct":0},
    {"id":"u09_q06","unit":9,"target_ja":"よろしく おねがいいたします。","romaji":"Yoroshiku onegai itashimasu.","tl_meaning":"Ikinagagalak ko pong makipagkilala / Pakiusap po.","en_meaning":"Nice to meet you / Thank you in advance.","blank_q":"おねがい ␣","options":["いたします (itashimasu)","になります (ni narimasu)","くださ (kudasa)"],"chunks":["よろしく","おねがいいたします。"],"tip_tl":"Pormal na pakiusap: 'おねがいいたします'.","correct":0},
    {"id":"u09_q07","unit":9,"target_ja":"あとで おでんわいたします。","romaji":"Ato de odenwa itashimasu.","tl_meaning":"Tawagan ko po kayo mamaya.","en_meaning":"I will call you later.","blank_q":"おでんわ ␣","options":["いたします (itashimasu)","になります (ni narimasu)","くださ (kudasa)"],"chunks":["あとで","おでんわいたします。"],"tip_tl":"Tawagan ko po kayo: 'おでんわいたします'.","correct":0},
    {"id":"u09_q08","unit":9,"target_ja":"どうぞ こちらへ おはいりください。","romaji":"Douzo kochira e ohairi kudasai.","tl_meaning":"Tuloy po kayo pumasok dito.","en_meaning":"Please step this way inside.","blank_q":"おはいり ␣","options":["ください (kudasai)","いたします (itashimasu)","になります (ni narimasu)"],"chunks":["どうぞ","こちらへ","おはいりください。"],"tip_tl":"Pumasok po kayo: 'おはいりください'.","correct":0},
    {"id":"u09_q09","unit":9,"target_ja":"メールを おくりしました。","romaji":"Meeru wo okuri shimashita.","tl_meaning":"Ipinadala ko po ang email.","en_meaning":"I sent the email.","blank_q":"メールを ␣","options":["おくりしました (okuri shimashita)","おくられました (okuraremashita)","おくりになりました (okuri ni narimashita)"],"chunks":["メールを","おくりしました。"],"tip_tl":"Ipinadala ko po: 'おくりしました'.","correct":0},
    {"id":"u09_q10","unit":9,"target_ja":"わたしが ごあんないいたします。","romaji":"Watashi ga goannai itashimasu.","tl_meaning":"Samahan/Ipagagabay ko po kayo.","en_meaning":"I will guide you.","blank_q":"ごあんない ␣","options":["いたします (itashimasu)","になります (ni narimasu)","くださ (kudasa)"],"chunks":["わたしが","ごあんないいたします。"],"tip_tl":"Igagabay ko po: 'ごあんないいたします'.","correct":0},

    {"id":"u09_q12","unit":9,"target_ja":"よろしく おつたえください。","romaji":"Yoroshiku otsutae kudasai.","tl_meaning":"Paki-sabi po sa kanila.","en_meaning":"Please give my regards.","blank_q":"おつたえ ␣","options":["ください (kudasai)","いたします (itashimasu)","になります (ni narimasu)"],"chunks":["よろしく","おつたえください。"],"tip_tl":"Paki-sabi po: 'おつたえください'.","correct":0},
    {"id":"u10_q01","unit":10,"target_ja":"おせわになっております。","romaji":"Osewa ni natte orimasu.","tl_meaning":"Salamat po sa inyong patuloy na pagsuporta.","en_meaning":"Thank you for your continued support.","blank_q":"おせわに ␣ おります。","options":["なって (natte)","なり (nari)","なる (naru)"],"chunks":["おせわになっております。"],"tip_tl":"謙譲語 ng 'います' kapag tungkol sa sarili ay 'おります'.","correct":0},
    {"id":"u10_q02","unit":10,"target_ja":"ただいま せきを はずしております。","romaji":"Tadaima seki wo hazushite orimasu.","tl_meaning":"Kasalukuyan po siyang wala sa kanyang upuan/lamesa.","en_meaning":"He/She is away from his/her desk right now.","blank_q":"せきを ␣ おります。","options":["はずして (hazushite)","はずし (hazushi)","はずす (hazusu)"],"chunks":["ただいま","せきを","はずしております。"],"tip_tl":"Wala sa upuan: 'はずしております'.","correct":0},

    {"id":"u10_q05","unit":10,"target_ja":"かしこまりました。","romaji":"Kashikomarimashita.","tl_meaning":"Naiintindihan ko po / Makakaasa po kayo.","en_meaning":"Certainly / Understood.","blank_q":"␣","options":["かしこまりました (kashikomarimashita)","わかりました (wakarimashita)","了解です (ryoukai desu)"],"chunks":["かしこまりました。"],"tip_tl":"Pormal na pagtanggap ng utos/kahilingan: 'かしこまりました'.","correct":0},
    {"id":"u10_q06","unit":10,"target_ja":"申し訳（もうしわけ）ございません。","romaji":"Moushiwake gozaimasen.","tl_meaning":"Humihingi po ako ng taos-pusong paumanhin.","en_meaning":"I am extremely sorry.","blank_q":"␣","options":["もうしわけございません (moushiwake gozaimasen)","ごめんなさい (gomen nasai)","すみません (sumimasen)"],"chunks":["申し訳（もうしわけ）ございません。"],"tip_tl":"Pinakapormal na paghingi ng tawad: '申し訳ございません'.","correct":0},

/* ==================== AUDIO (Japanese TTS + 437Hz brand tone) ==================== */
let voices = [];
let voicePrefs = JSON.parse(localStorage.getItem('jp_voice_prefs') || '{}');
if(voicePrefs.speed === undefined) voicePrefs.speed = 0.90;

function refreshVoices(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('ja')) : [];
  populateVoiceSelect();
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function populateVoiceSelect(){
  const sel = document.getElementById('voiceSelect');
  if(!sel) return;
  sel.innerHTML = '';
  if(voices.length === 0){
    const opt = document.createElement('option');
    opt.textContent = '(default / walang Japanese voice na nakita)';
    sel.appendChild(opt);
    return;
  }
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(opt);
  });
  if(voicePrefs.voiceName){
    const idx = voices.findIndex(v => v.name === voicePrefs.voiceName);
    if(idx >= 0) sel.value = idx;
  }
}
function getSelectedVoice(){
  if(voicePrefs.voiceName){
    const found = voices.find(v => v.name === voicePrefs.voiceName);
    if(found) return found;
  }
  return voices[0];
}
/* TTS reads the bracket-furigana source text as-is, which double-reads
   words like 本（ほん）— the kanji AND the kana reading. Strip the
   （かな） part before handing text to speechSynthesis; the on-screen
   text (with the reading visible) is untouched. */
function stripFuriganaForSpeech(text){
  return text.replace(/([\u4E00-\u9FFF\u30A0-\u30FF\u30FCー]+)（([\u3040-\u309F\u30FCー]+)）/g, '$1');
}
function speak(text, onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = getSelectedVoice();
  if(v) u.voice = v;
  u.lang = 'ja-JP';
  u.rate = voicePrefs.speed || 0.90;
  if(onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}
function playBrandTone(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 437;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.9);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.9);
  }catch(e){}
}

    `;
    if(!lv.comingSoon){
      pill.addEventListener('click', () => {
        if(currentLevel === key) return;
        currentLevel = key;
        localStorage.setItem('jp_level', key);
        progress = loadProgress();
        renderHome();
      });
    }
    wrap.appendChild(pill);
  });
}

/* ==================== HOME RENDER ==================== */
function unitStats(unitN){
  const qs = LV().questions.filter(q => q.unit === unitN);
  const masteredCount = qs.filter(q => progress.mastered[q.id]).length;
  return { total: qs.length, mastered: masteredCount };
}
function totalWeakCount(){ return Object.keys(progress.weak).length; }

function renderHome(){
  renderLevelSelector();

  const list = document.getElementById('unitList');
  list.innerHTML = '';
  LV().units.forEach(u => {
    const stats = unitStats(u.n);
    const pct = stats.total ? Math.round((stats.mastered/stats.total)*100) : 0;
    const row = document.createElement('div');
    row.className = 'unit-row';
    row.innerHTML = `
      <div class="unit-seal ${pct===100?'mastered':''}">${pct===100?'✓':String(u.n).padStart(2,'0')}</div>
      <div class="unit-body">
        <div class="unit-theme">Unit ${u.n} — ${u.jp}</div>
        <div class="unit-particle">${u.badge}</div>
        <div class="unit-desc">${currentLang === 'tl' ? u.tl : u.en}</div>
        <div class="unit-track"><div class="unit-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="unit-count">${stats.mastered}/${stats.total}</div>
    `;
    row.addEventListener('click', () => startUnit(u.n));
    list.appendChild(row);
  });

  const weakCta = document.getElementById('weakCta');
  const wc = totalWeakCount();
  document.getElementById('weakCount').textContent = wc;
  weakCta.style.display = wc > 0 ? 'flex' : 'none';
  weakCta.onclick = () => startWeakReview();

  applyStaticStrings();
  showScreen('home');
}

/* ==================== LESSON STATE ==================== */
let session = { queue: [], idx: 0, correctCount: 0, wrongIds: [], unitLabel: '', isWeakMode:false, startTime:0 };

function startUnit(unitN){
  const qs = LV().questions.filter(q => q.unit === unitN);
  const meta = LV().units.find(u => u.n === unitN);
  session = { queue: qs, idx:0, correctCount:0, wrongIds:[], unitLabel:`Unit ${unitN} — ${meta.jp}`, isWeakMode:false, startTime:Date.now() };
  runLesson();
}
function startWeakReview(){
  const ids = Object.keys(progress.weak);
  const qs = LV().questions.filter(q => ids.includes(q.id));
  if(qs.length === 0) return;
  session = { queue: qs, idx:0, correctCount:0, wrongIds:[], unitLabel:T('weakModeLabel'), isWeakMode:true, startTime:Date.now() };
  runLesson();
}

function runLesson(){
  document.getElementById('lessonUnitTag').textContent = `${LV().code} · ${session.unitLabel}`;
  renderProgressDots();
  showStepQuestion();
  showScreen('lesson');
}

function renderProgressDots(){
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = '';
  session.queue.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    if(i < session.idx) d.classList.add(session.wrongIds.includes(q.id) ? 'wrong' : 'done');
    if(i === session.idx) d.classList.add('now');
    wrap.appendChild(d);
  });
}

/* ==================== QUESTION FLOW ==================== */
let chunkState = { pool: [], placed: [], correctSeq: [] };
let step2Answered = false;

function currentQ(){ return session.queue[session.idx]; }

function showStepQuestion(){
  const panes = ['step1','step2','step3','step4'];
  panes.forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('step1').style.display = 'block';
  applyStaticStrings();
  setupStep1();
}

/* --- STEP 1: listening --- */
let listenCount = 0;
function setupStep1(){
  const q = currentQ();
  listenCount = 0;
  document.getElementById('listenCount').textContent = '';
  document.getElementById('toStep2Btn').disabled = true;
  const playBtn = document.getElementById('playBtn');
  playBtn.onclick = () => {
    playBtn.classList.add('playing');
    speak(stripFuriganaForSpeech(q.target_ja), () => {
      playBtn.classList.remove('playing');
      listenCount++;
      document.getElementById('listenCount').textContent = T('listenCount', listenCount);
      document.getElementById('toStep2Btn').disabled = false;
    });
  };
  document.getElementById('toStep2Btn').onclick = () => {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    setupStep2();
  };
}

/* --- STEP 2: fill-in-the-blank --- */
function setupStep2(){
  const q = currentQ();
  step2Answered = false;
  const parts = q.blank_q.split('␣');
  const blankHtml = document.getElementById('blankSentence');
  blankHtml.innerHTML = `${parts[0] || ''}<span class="slot" id="slotMark">?</span>${parts[1] || ''}`;

  const list = document.getElementById('choiceList');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const el = document.createElement('div');
    el.className = 'choice';
    el.textContent = opt;
    el.addEventListener('click', () => {
      if(step2Answered) return;
      step2Answered = true;
      const cards = list.querySelectorAll('.choice');
      cards.forEach(c => c.classList.add('disabled'));
      const slot = document.getElementById('slotMark');
      if(i === q.correct){
        el.classList.add('correct');
        slot.textContent = opt.split(' ')[0];
        slot.classList.add('filled');
      } else {
        el.classList.add('wrong');
        cards[q.correct].classList.add('correct');
        slot.textContent = q.options[q.correct].split(' ')[0];
        slot.classList.add('filled');
        markWrong(q);
      }
      setTimeout(() => {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        setupStep3();
      }, 750);
    });
    list.appendChild(el);
  });
}

/* --- STEP 3: chunk reorder (movable type) --- */
function setupStep3(){
  const q = currentQ();
  if(q.chunks.length <= 1){
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step4').style.display = 'block';
    setupStep4();
    return;
  }
  chunkState.correctSeq = q.chunks.slice();
  chunkState.placed = [];
  chunkState.pool = q.chunks.map((c,i) => ({text:c, key:i, used:false}));
  shuffleUntilDifferent(chunkState.pool);
  renderAssembly();
}
function shuffleUntilDifferent(arr){
  if(arr.length <= 1) return;
  const original = arr.map(a=>a.text).join('|');
  let tries = 0;
  do{
    for(let i = arr.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    tries++;
  } while(arr.map(a=>a.text).join('|') === original && tries < 8);
}
function renderAssembly(){
  const line = document.getElementById('assemblyLine');
  const pool = document.getElementById('typePool');
  line.innerHTML = '';
  pool.innerHTML = '';

  if(chunkState.placed.length === 0){
    line.classList.remove('filled');
    line.innerHTML = `<span class="assembly-placeholder">${T('assemblyPlaceholder')}</span>`;
  } else {
    line.classList.add('filled');
    chunkState.placed.forEach(p => {
      const b = document.createElement('span');
      b.className = 'type-block used-slot jp';
      b.textContent = p.text;
      b.addEventListener('click', () => {
        if(chunkState.placed[chunkState.placed.length-1].key === p.key){
          chunkState.placed.pop();
          const orig = chunkState.pool.find(x => x.key === p.key);
          orig.used = false;
          renderAssembly();
        }
      });
      line.appendChild(b);
    });
  }

  chunkState.pool.forEach(p => {
    const b = document.createElement('span');
    b.className = 'type-block jp' + (p.used ? ' placed' : '');
    b.textContent = p.text;
    if(!p.used){
      b.addEventListener('click', () => {
        p.used = true;
        chunkState.placed.push(p);
        renderAssembly();
        if(chunkState.placed.length === chunkState.pool.length){
          evaluateAssembly();
        }
      });
    }
    pool.appendChild(b);
  });
}
document.getElementById('resetChunksBtn').addEventListener('click', () => {
  chunkState.pool.forEach(p => p.used = false);
  chunkState.placed = [];
  renderAssembly();
});
function evaluateAssembly(){
  const q = currentQ();
  const built = chunkState.placed.map(p => p.text).join('|');
  const correct = chunkState.correctSeq.join('|');
  const ok = built === correct;
  const line = document.getElementById('assemblyLine');
  line.style.borderColor = ok ? 'var(--good)' : 'var(--bad)';
  if(!ok) markWrong(q);
  setTimeout(() => {
    line.style.borderColor = '';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('step4').style.display = 'block';
    setupStep4();
  }, 650);
}

/* --- STEP 4: reveal + shadow reading --- */
function setupStep4(){
  const q = currentQ();
  document.getElementById('revealJp').textContent = q.target_ja;
  document.getElementById('revealRomaji').textContent = q.romaji;
  document.getElementById('revealMeaning').textContent = currentLang === 'tl' ? q.tl_meaning : q.en_meaning;
  document.getElementById('revealTip').innerHTML = `<b>${T('tipPrefix')}</b>${q.tip_tl || ''}<span class="tip-lang-note">${T('tipLangNote')}</span>`;
  document.getElementById('replayBtn').onclick = () => speak(stripFuriganaForSpeech(q.target_ja));
  document.getElementById('nextQBtn').onclick = () => {
    document.getElementById('step4').style.display = 'none';
    advanceQuestion(q);
  };
}

function markWrong(q){
  if(!session.wrongIds.includes(q.id)) session.wrongIds.push(q.id);
  progress.weak[q.id] = true;
  saveProgress(progress);
}

function advanceQuestion(q){
  if(!session.wrongIds.includes(q.id)){
    session.correctCount++;
    progress.mastered[q.id] = true;
    delete progress.weak[q.id];
    saveProgress(progress);
  }
  session.idx++;
  if(session.idx >= session.queue.length){
    finishSession();
  } else {
    renderProgressDots();
    showStepQuestion();
  }
}

/* ==================== COMPLETE SCREEN ==================== */
let lastCompleteStats = null;
function finishSession(){
  renderProgressDots();
  playBrandTone();
  const total = session.queue.length;
  const correct = session.correctCount;
  const pct = Math.round((correct/total)*100);
  const seconds = Math.round((Date.now() - session.startTime)/1000);
  const mm = Math.floor(seconds/60), ss = seconds%60;
  lastCompleteStats = { total, correct, pct, mm, ss };

  refreshCompleteTexts();

  const retryBtn = document.getElementById('retryWrongBtn');
  if(session.wrongIds.length > 0){
    retryBtn.style.display = 'block';
    retryBtn.onclick = () => {
      const qs = LV().questions.filter(q => session.wrongIds.includes(q.id));
      session = { queue: qs, idx:0, correctCount:0, wrongIds:[], unitLabel: session.unitLabel + T('weakModeSuffix'), isWeakMode:true, startTime:Date.now() };
      runLesson();
    };
  } else {
    retryBtn.style.display = 'none';
  }
  document.getElementById('toHomeBtn').onclick = renderHome;
  showScreen('complete');
}
function refreshCompleteTexts(){
  if(!lastCompleteStats) return;
  const {total, correct, pct, mm, ss} = lastCompleteStats;
  document.getElementById('completeSealText').textContent = pct === 100 ? T('complete100') : T('completeDefault');
  document.getElementById('completeUnitName').textContent = session.unitLabel;
  document.getElementById('completeScore').textContent = `${correct} / ${total}`;
  document.getElementById('completeMeta').textContent = T('completeMeta', pct, mm, ss);
  document.getElementById('retryWrongBtn').textContent = T('retryWrongBtn');
  document.getElementById('toHomeBtn').textContent = T('toHomeBtn');
}

/* ==================== INIT ==================== */
applyStaticStrings();
renderHome();

</script>
